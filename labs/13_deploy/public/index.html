<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스마트몰 상담</title>
  <style>
    :root { --navy: #0b1f3a; --blue: #00a3ff; --line: #d6dee8; --soft: #f8fafc; --muted: #64748b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Malgun Gothic", system-ui, sans-serif; background: var(--soft); color: #1e293b; }
    header { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
    header h1 { font-size: 18px; margin: 0 auto 0 0; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    #log { display: flex; flex-direction: column; gap: 8px; min-height: 50vh; }
    .msg { padding: 10px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; line-height: 1.5; }
    .user { align-self: flex-end; background: var(--blue); color: #fff; }
    .bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); }
    .info { align-self: center; color: var(--muted); font-size: 13px; }
    form { display: flex; gap: 8px; margin-top: 16px; }
    form input { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    .primary { background: var(--navy); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>스마트몰 상담</h1>
    <button id="new" type="button">새 대화</button>
  </header>
  <main>
    <div id="log"></div>
    <form id="form">
      <input id="message" autocomplete="off" maxlength="500" placeholder="예: A100 배송이 늦어요. 언제 와요?" />
      <button class="primary">보내기</button>
    </form>
  </main>
  <script type="module">
    // 화면 하나짜리 채팅 — 서버의 POST /api/chat을 부른다
    const log = document.querySelector("#log");
    const form = document.querySelector("#form");
    const input = document.querySelector("#message");

    // 대화방 ID — 같은 ID로 보내면 서버가 앞 대화를 이어 간다
    let threadId = crypto.randomUUID();

    function show(text, kind) {
      const div = document.createElement("div");
      div.className = `msg ${kind}`;
      // **굵게**만 굵은 글씨로 바꾼다 (HTML로 넣지 않고 글자 노드로 만들어 안전하다)
      text.split(/\*\*(.+?)\*\*/).forEach((part, i) => {
        if (i % 2 === 0) div.append(part);
        else div.append(Object.assign(document.createElement("strong"), { textContent: part }));
      });
      log.append(div);
      div.scrollIntoView({ block: "end" });
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      show(message, "user");
      const waiting = show("답변을 기다리는 중…", "info");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ threadId, message }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error ?? `요청 실패 (${res.status})`);
        show(data.answer, "bot");
      } catch (error) {
        show(`⚠️ ${error.message}`, "info");
      } finally {
        waiting.remove();
      }
    });

    document.querySelector("#new").addEventListener("click", () => {
      threadId = crypto.randomUUID();
      log.replaceChildren();
      show("새 대화를 시작합니다.", "info");
    });
  </script>
</body>
</html>
