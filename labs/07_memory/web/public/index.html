<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>07 메모리 챗봇</title>
  <style>
    :root { --navy: #0b1f3a; --blue: #00a3ff; --line: #d6dee8; --soft: #f8fafc; --muted: #64748b; --red: #dc2626; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Malgun Gothic", system-ui, sans-serif; background: var(--soft); color: #1e293b; }
    header { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    #thread { margin-right: auto; font: 12px Consolas, monospace; color: #cbd5e1; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; }
    button:disabled { opacity: 0.5; cursor: default; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    #log { display: flex; flex-direction: column; gap: 8px; min-height: 50vh; }
    .msg { padding: 10px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; line-height: 1.5; }
    .user { align-self: flex-end; background: var(--blue); color: #fff; }
    .bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); }
    .info { align-self: center; color: var(--muted); font-size: 13px; }
    .error { align-self: center; color: var(--red); font-size: 13px; }
    form { display: flex; gap: 8px; margin-top: 16px; }
    form input { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    .primary { background: var(--navy); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>07 메모리 챗봇</h1>
    <span id="thread"></span>
    <button id="new" type="button">새 대화</button>
  </header>
  <main>
    <div id="log"></div>
    <form id="form">
      <input id="message" autocomplete="off" maxlength="500" placeholder="예: 제 이름은 김민준이에요 → 제 이름이 뭐였죠?" />
      <button id="send" class="primary">보내기</button>
    </form>
  </main>
  <script type="module">
    // 화면 하나짜리 채팅 — 서버의 POST /api/chat을 부른다
    const log = document.querySelector("#log");
    const form = document.querySelector("#form");
    const input = document.querySelector("#message");
    const send = document.querySelector("#send");
    const threadLabel = document.querySelector("#thread");

    // 대화방 ID — 같은 ID로 보내면 서버의 체크포인터가 앞 대화를 이어 간다
    let threadId;
    function newThread() {
      threadId = crypto.randomUUID();
      threadLabel.textContent = `thread ${threadId.slice(0, 8)}`;
    }
    newThread();

    function show(text, kind) {
      const div = document.createElement("div");
      div.className = `msg ${kind}`;
      div.textContent = text; // 글자로만 넣는다 (HTML로 해석하지 않아 안전하다)
      log.append(div);
      div.scrollIntoView({ block: "end" });
      return div;
    }

    // 보내기 버튼 · Enter 모두 submit 이벤트로 들어온다
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      show(message, "user");
      const waiting = show("…", "bot");
      send.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ threadId, message }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error ?? `요청 실패 (${res.status})`);
        show(data.answer, "bot");
      } catch (error) {
        show(`⚠️ ${error.message}`, "error");
      } finally {
        waiting.remove();
        send.disabled = false;
        input.focus();
      }
    });

    // 새 대화 = 새 threadId → 체크포인터의 앞 대화는 이어지지 않지만 스토어(연락 방법)는 남는다
    document.querySelector("#new").addEventListener("click", () => {
      newThread();
      log.replaceChildren();
      show("새 대화를 시작합니다.", "info");
    });
  </script>
</body>
</html>
